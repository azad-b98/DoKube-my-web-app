apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-web-deployment
spec:
  replicas: 2          # We want Kubernetes to keep exactly 2 copies of our app running!
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: my-web-container
        image: azadbukhari/my-web-app:v2  # Your image pulled from the cloud
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-web-service
spec:
  type: NodePort       # Exposes the service externally outside the cluster
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30001    # This will map port 30001 on your computer to our application
  selector:
    app: web-app
